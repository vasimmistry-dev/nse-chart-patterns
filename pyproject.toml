[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "nse-chart-patterns"
version = "0.1.0"
description = "Transparent, rule-based candlestick and chart pattern detection for daily OHLCV data (NSE-friendly, pure Python)."
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [{name = "Vasim Mistry"}]
keywords = ["technical-analysis", "candlestick", "chart-patterns", "nse", "india", "stocks", "ohlcv"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Intended Audience :: Education",
    "Topic :: Office/Business :: Financial :: Investment",
]
dependencies = []

[project.optional-dependencies]
test = ["pytest>=7"]

[project.urls]
Homepage = "https://github.com/vasimmistry-dev/nse-chart-patterns"
Issues = "https://github.com/vasimmistry-dev/nse-chart-patterns/issues"

[project.scripts]
chart-patterns = "nse_chart_patterns.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
